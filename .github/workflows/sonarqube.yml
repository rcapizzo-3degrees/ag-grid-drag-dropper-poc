on:
  # Trigger analysis when pushing to your main branches, and when creating a pull request.
  push:
    branches:
      - main
      - master
      - develop
      - 'releases/**'
  pull_request:
      types: [opened, synchronize, reopened]

name: Main Workflow
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v4.2.1 # Ex: v4.1.0, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: app/src
        args: >
          -Dsonar.organization=rcapizzo-3degrees
          -Dsonar.projectKey=rcapizzo-3degrees_ag-grid-drag-dropper-poc
          #-Dsonar.python.coverage.reportPaths=coverage.xml
          #-Dsonar.sources=lib/
          #-Dsonar.tests=tests/
          #-Dsonar.test.exclusions=tests/**
          #-Dsonar.verbose=true
